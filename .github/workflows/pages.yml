name: Deploy Pages

# Publishes only the built site, not scripts/, config/, raw markdown or working files.
# Needs Settings > Pages > Source set to "GitHub Actions" (owner step).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site folder
        run: |
          mkdir -p _site/data
          cp index.html about.html 404.html sitemap.xml _site/
          cp -r posts assets _site/
          cp data/search.json data/posts.json _site/data/
          [ -f social.html ] && cp social.html _site/
          [ -d social ] && cp -r social _site/
          # Kept (noindex) because the NotebookLM podcast step needs a public URL.
          [ -f podcast-source.html ] && cp podcast-source.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
